set -g update-environment ''
set -g exit-empty on
set -g escape-time 0
set -g window-size latest
set -g mouse on
set -gq focus-follows-mouse on
set -g prefix C-b
set -g prefix2 C-\\
bind C-b send-keys C-b
bind C-\\ send-keys C-\\
set -g status on
set -g status-left ' sbx:proj '
set -g status-left-length 40
set -g status-right ' prefix #{prefix}#{?#{!=:#{prefix2},None}, or #{prefix2},} '
